<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FUD Health Centre — Patient Dashboard</title>
<script>
  (function(){
    try {
      var t = localStorage.getItem('fud-patient-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
<style>
:root{
  --primary:#0D6B4E; --primary-mid:#0F9B6E; --primary-light:#10B981;
  --bg:#F0FDF4; --panel-bg:#FFFFFF; --neu-bg:#FFFFFF;
  --neu-shadow-d:#c6e6d6; --neu-shadow-l:#ffffff;
  --text:#0F172A; --text-muted:#64748B;
  --input-bg:#FFFFFF; --input-border:#CBD5E1; --input-bg-err:#FEF2F2;
  --card-border:rgba(255,255,255,0.80); --card-border-solid:#CBD5E1;
  --success:#10B981; --error:#EF4444; --info:#2563EB; --white:#FFFFFF;
  --shadow-rgb:13,107,78;
  --radius-card:20px; --radius-input:12px; --radius-btn:999px;
  --overlay-grad:linear-gradient(150deg,#10B981 0%,#0D6B4E 100%);
  --brand-grad:linear-gradient(135deg,#10B981 0%,#0D6B4E 100%);
  --content-max:1200px;
}
[data-theme="dark"]{
  --primary:#2ECC8F; --primary-mid:#1AB87A; --primary-light:#4DD9A3;
  --bg:#0D1F18; --panel-bg:#172A1E; --neu-bg:#0F1C15;
  --neu-shadow-d:#060e09; --neu-shadow-l:#1a2e20;
  --text:#E6F4EC; --text-muted:#7AAF90;
  --input-bg:#0D1F18; --input-border:#2D4A3A; --input-bg-err:#2A1018;
  --card-border:rgba(255,255,255,0.18); --card-border-solid:#2D4A3A;
  --success:#2ECC8F; --error:#F87171; --info:#60A5FA; --white:#E6F4EC;
  --shadow-rgb:46,204,143;
}
*{box-sizing:border-box;margin:0;padding:0}
*{user-select:none;-webkit-user-select:none}

/* Drawer nav title */
.drawer-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;}
html,body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh;transition:background 250ms ease,color 250ms ease}
body{overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
.blob1{width:500px;height:500px;background:rgba(16,185,129,0.12);top:-150px;left:-150px;animation:blobDrift1 22s ease-in-out infinite alternate}
.blob2{width:420px;height:420px;background:rgba(var(--shadow-rgb),0.10);bottom:-120px;right:-120px;filter:blur(80px);animation:blobDrift2 18s ease-in-out infinite alternate}
@keyframes blobDrift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(120px,80px) scale(1.15)}}
@keyframes blobDrift2{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-100px,-60px) scale(1)}}

/* Auth screen */
#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-size:20px;color:var(--text-muted);font-family:'Poppins',sans-serif;gap:14px;position:relative;z-index:1}
#authScreen .spin{font-size:36px;color:var(--primary);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.layout{position:relative;z-index:1}

/* TOPBAR */
.topbar-shell{position:fixed;top:0;left:0;right:0;z-index:90;max-width:var(--content-max);margin:12px auto 0;padding-inline:clamp(16px,3vw,32px);pointer-events:none}
.topbar{
  position:relative;top:0;z-index:90;
  width:100%;
  padding:10px clamp(20px,4vw,36px);
  background:color-mix(in srgb, var(--panel-bg) 78%, transparent);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1.5px solid var(--card-border-solid);
  border-radius:var(--radius-card);
  box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.12);
  display:flex;align-items:center;gap:14px;
  pointer-events:auto;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:42px;height:42px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.35);overflow:hidden;border:2.5px solid #0D6B4E}
.brand-logo-img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.brand-name{font-weight:800;font-size:13px;color:var(--text);line-height:1.1}
.brand-sub{font-size:10px;color:var(--text-muted);font-weight:500;margin-top:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text);cursor:pointer;font-size:18px;transition:all 180ms ease}
.icon-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.18)}
.logout-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.22);font:600 13px 'Poppins';cursor:pointer;transition:all 180ms ease}
.logout-btn:hover{background:rgba(239,68,68,0.18)}
.desktop-logout-btn{display:inline-flex;}
@media(max-width:768px){.desktop-logout-btn{display:none;}}
.hamburger{display:none}

/* NAV STRIP */
.topnav-strip-wrapper{position:fixed;top:78px;z-index:89;left:0;right:0;max-width:var(--content-max);margin:14px auto 0;padding-inline:clamp(64px,10vw,120px);pointer-events:none}
.topnav-strip-outer{padding:14px 16px;background:color-mix(in srgb, var(--panel-bg) 78%, transparent);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1.5px solid var(--card-border-solid);border-radius:24px;box-shadow:0 8px 24px rgba(var(--shadow-rgb),0.08);pointer-events:auto}
.topnav-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nav-item{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 20px;min-height:44px;background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:999px;color:var(--text-muted);font:700 14px 'Poppins',sans-serif;opacity:.6;cursor:pointer;transition:all 200ms ease}
.nav-item i{font-size:18px}
.nav-item:hover{opacity:.9;transform:translateY(-1px)}
.nav-item.active{color:#fff;border-color:transparent;background:var(--brand-grad);box-shadow:0 6px 20px rgba(var(--shadow-rgb),0.40);opacity:1}
.nav-item[data-tab="dashboard"]{grid-column:1 / -1}
.nav-item[data-tab="profile"]{grid-column:1 / -1}

/* MAIN */
.main{max-width:var(--content-max);margin:0 auto 60px;padding:clamp(24px,5vw,60px) clamp(64px,10vw,120px);padding-top:var(--main-top-offset,200px);position:relative;z-index:1}
.page{display:none}
.page.active{display:block;animation:fadeUp 360ms ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.page-title{font-size:26px;font-weight:800;color:var(--text);margin-bottom:24px;display:flex;align-items:center;gap:10px}
.page-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand-grad)}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:36px}
.stat-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:22px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 6px rgba(0,0,0,0.04),0 10px 24px rgba(var(--shadow-rgb),0.08),inset 0 1px 0 rgba(255,255,255,0.60);position:relative;overflow:hidden;transition:transform 200ms ease,box-shadow 200ms ease}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand-grad);opacity:.35;transition:opacity 200ms ease}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 6px 10px rgba(0,0,0,0.06),0 14px 32px rgba(var(--shadow-rgb),0.14)}
.stat-card:hover::before{opacity:1}
.stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(13,107,78,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);font-size:22px;flex-shrink:0}
.stat-icon.amber{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(245,158,11,0.08));border-color:rgba(245,158,11,0.25);color:#F59E0B}
.stat-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-muted)}
.stat-value{font-size:30px;font-weight:800;color:var(--text);line-height:1}

/* FOLLOW-UP CARD */
.followup-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 4px 6px rgba(0,0,0,0.04),0 10px 24px rgba(var(--shadow-rgb),0.08);position:relative;overflow:hidden}
.followup-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--brand-grad)}
.followup-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(13,107,78,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);font-size:20px}
.followup-body{flex:1;min-width:180px}
.followup-title{font-weight:700;font-size:14px;color:var(--text)}
.followup-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.section-title{font-size:15px;font-weight:700;color:var(--text)}

/* BUTTONS */
.btn-primary{background:var(--brand-grad);color:#fff;border:none;border-radius:999px;padding:10px 20px;font:600 13px 'Poppins';box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.35);cursor:pointer;transition:all 180ms ease;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.45)}
.btn-secondary{background:var(--panel-bg);color:var(--text);border:1.5px solid var(--card-border-solid);border-radius:999px;padding:10px 20px;font:600 13px 'Poppins';cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 180ms ease}
.btn-secondary:hover{background:color-mix(in srgb, var(--primary) 6%, var(--panel-bg))}
.btn-danger{background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.22);border-radius:999px;padding:8px 16px;font:600 12px 'Poppins';cursor:pointer;transition:all 180ms ease}
.btn-danger:hover{background:rgba(239,68,68,0.20)}
.btn-sm{padding:6px 12px;font-size:12px}

/* TABLES */
.table-wrap{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);overflow:hidden;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:rgba(var(--shadow-rgb),0.06);padding:12px 16px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);font-weight:700;border-bottom:1.5px solid var(--card-border-solid);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--card-border-solid);color:var(--text);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
tr:last-child td{border-bottom:none}

/* ZEBRA STRIPING */
tbody tr:nth-child(odd) td{background:rgba(255,255,255,0.6)}
tbody tr:nth-child(even) td{background:rgba(16,185,129,0.04)}
[data-theme="dark"] tbody tr:nth-child(odd) td{background:rgba(255,255,255,0.02)}
[data-theme="dark"] tbody tr:nth-child(even) td{background:rgba(46,204,143,0.05)}
tbody tr:hover td{background:rgba(var(--shadow-rgb),0.08) !important}

/* CELL TYPOGRAPHY */
td.cell-name{font-weight:700;color:var(--text);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.cell-email{font-size:12px;color:var(--text-muted);font-weight:500}
td.cell-id{font-family:monospace;font-weight:600;color:var(--primary);font-size:12.5px}
td.cell-date{font-style:italic;font-size:12px;color:var(--text-muted);font-weight:500}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.pending{color:#F59E0B;background:rgba(245,158,11,0.12)}
.badge.approved{color:#0F9B6E;background:rgba(16,185,129,0.12)}
.badge.cancelled{color:#EF4444;background:rgba(239,68,68,0.12)}
.badge.verified{color:#2563EB;background:rgba(37,99,235,0.12)}
.badge.issued{color:#0F9B6E;background:rgba(16,185,129,0.12)}
.badge.dispensed{color:#2563EB;background:rgba(37,99,235,0.12)}

/* FORMS */
.form-wrap{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;margin-bottom:24px;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06)}
.form-wrap-collapsible{overflow:hidden;max-height:0;opacity:0;transform:translateY(-8px);transition:max-height 380ms cubic-bezier(0.34,1.1,0.64,1),opacity 280ms ease,transform 300ms cubic-bezier(0.34,1.1,0.64,1),margin 280ms ease;margin-bottom:0}
.form-wrap-collapsible.open{max-height:700px;opacity:1;transform:translateY(0);margin-bottom:24px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.form-field{display:flex;flex-direction:column;min-width:0}
.form-field.full{grid-column:1 / -1}
.form-label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:500 14px 'Poppins';transition:border-color 180ms ease,box-shadow 180ms ease;font-family:'Poppins',sans-serif}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15);outline:none}
.form-textarea{min-height:90px;resize:vertical}
.form-actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
.disclaimer{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:12px}

/* STATE BOX */
.state-box{text-align:center;padding:48px 24px;color:var(--text-muted);font-size:14px}
.state-box i{font-size:36px;display:block;margin-bottom:10px;color:var(--text-muted);opacity:.7}

/* PAGINATION */
.pagination-wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;flex-wrap:wrap;gap:10px}
.pagination-info{font-size:12px;color:var(--text-muted)}
.pagination{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page-pill{min-width:34px;height:34px;padding:0 10px;border-radius:999px;border:1.5px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text-muted);font:600 12px 'Poppins';cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all 180ms ease}
.page-pill:hover:not(:disabled){color:var(--text);transform:translateY(-1px)}
.page-pill.active{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.30)}
.page-pill:disabled{opacity:.4;cursor:not-allowed}

/* TOASTS */
#toastContainer{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  max-width:var(--content-max);width:calc(100% - 48px);
  display:flex;flex-direction:column;gap:10px;
  padding-top:16px;z-index:9999;pointer-events:none;
}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  padding:10px 38px 10px 12px;background:var(--panel-bg);border-radius:14px;
  border-left:4px solid var(--text-muted);
  box-shadow:0 16px 40px rgba(15,23,42,0.18),0 2px 8px rgba(15,23,42,0.08);
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(-120%);
  animation:toastDropIn 650ms cubic-bezier(0.34,1.56,0.64,1) forwards;
  touch-action:none;
  will-change:transform,opacity;
  cursor:grab;
}
.toast.is-dragging{
  cursor:grabbing;
  animation:none;
  opacity:1;
  transform:translateY(0);
  transition:none;
}
/* Drag hint bar — mobile only */
.toast-drag-hint{
  display:none;
  position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:32px;height:3px;border-radius:99px;
  background:var(--text-muted);opacity:.35;
}
@keyframes toastDropIn{
  0%{opacity:0;transform:translateY(-120%);}
  60%{opacity:1;transform:translateY(8%);}
  80%{transform:translateY(-4%);}
  100%{opacity:1;transform:translateY(0);}
}
@media(max-width:640px){
  #toastContainer{width:calc(100% - 24px);}
  .toast{padding-top:16px;padding-right:12px;}
  .toast-close{display:none !important;}
  .toast-drag-hint{display:block;}
}
.toast.t-success{border-left-color:var(--success)}
.toast.t-error{border-left-color:var(--error)}
.toast.t-info{border-left-color:var(--info)}
.toast-icon{flex-shrink:0;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:1rem}
.toast.t-success .toast-icon{background:rgba(16,185,129,0.14);color:var(--success)}
.toast.t-error .toast-icon{background:rgba(239,68,68,0.14);color:var(--error)}
.toast.t-info .toast-icon{background:rgba(37,99,235,0.14);color:var(--info)}
.toast-body{min-width:0}
.toast-title{font-size:13px;font-weight:700;color:var(--text)}
.toast-msg{font-size:12px;color:var(--text-muted);line-height:1.4}
.toast-close{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;color:var(--text-muted);display:grid;place-items:center}
.toast-close i{font-size:14px}

/* CONFIRM MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 200ms ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.30);animation:popIn 280ms cubic-bezier(0.34,1.5,0.64,1)}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.modal-msg{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* RECEIPT MODAL */
.receipt-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:32px;max-width:480px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.30);animation:popIn 280ms cubic-bezier(0.34,1.5,0.64,1)}
.receipt-head{text-align:center;margin-bottom:20px;padding-bottom:18px;border-bottom:2px dashed var(--card-border-solid)}
.receipt-head h2{font-size:20px;font-weight:800;color:var(--primary);margin-bottom:4px}
.receipt-head p{font-size:12px;color:var(--text-muted)}
.receipt-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--card-border-solid)}
.receipt-row strong{color:var(--text);font-weight:600}
.receipt-row span{color:var(--text-muted)}
.receipt-amount{font-size:22px;font-weight:800;color:var(--primary);text-align:center;margin:18px 0;padding:14px;background:rgba(16,185,129,0.08);border-radius:14px}

/* MOBILE DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:95;opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 280ms ease}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,320px);background:var(--panel-bg);border-left:1px solid var(--card-border);border-top-left-radius:24px;border-bottom-left-radius:24px;box-shadow:-20px 0 50px rgba(0,0,0,0.25);transform:translateX(110%);transition:transform 380ms cubic-bezier(0.34,1.2,0.64,1);z-index:96;display:flex;flex-direction:column;padding:24px}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.drawer-nav{display:flex;flex-direction:column;gap:8px;padding:14px 4px;overflow-y:auto;flex:1}
.drawer-nav .nav-item{justify-content:flex-start;width:100%;border-radius:999px;padding:12px 16px;min-height:0;font-size:14px;font-weight:500;background:var(--bg);border:none;color:var(--text);box-shadow:none;opacity:1 !important;transform:none !important;grid-column:auto !important}
.drawer-nav .nav-item:hover{background:var(--brand-grad);color:#fff;box-shadow:none}
.drawer-nav .nav-item.active{background:var(--brand-grad);color:#fff;box-shadow:none}
.drawer-foot{padding-top:14px;border-top:1px solid var(--card-border-solid);display:flex;gap:8px;align-items:center}

@media (max-width: 768px){
  .topnav-strip-wrapper{display:none}
  .hamburger{display:flex}
  .stat-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .form-grid{grid-template-columns:1fr}
  .topbar-shell{margin:8px 10px 0;padding-inline:0;max-width:none}
  .main{padding:clamp(16px,4vw,32px);padding-top:var(--main-top-offset,90px)}
  .page-title{font-size:20px}
  .brand-name{font-size:12px}
}
@media (max-width: 480px){
  .stat-grid{grid-template-columns:1fr}
  .top-right .logout-btn span{display:none}
}

/* CUSTOM SELECT */
.custom-select-wrap{position:relative;width:100%;font-family:'Poppins',sans-serif;z-index:1}
.custom-select-wrap.open{z-index:100}
.custom-select-trigger{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:500 14px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:border-color 180ms ease,box-shadow 180ms ease;text-align:left}
.custom-select-trigger:hover{border-color:var(--primary)}
.custom-select-wrap.open .custom-select-trigger{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15)}
.custom-select-trigger .cs-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-select-trigger .cs-label.placeholder{color:var(--text-muted)}
.custom-select-trigger .cs-caret{transition:transform 200ms ease;color:var(--text-muted);font-size:16px;flex-shrink:0}
.custom-select-wrap.open .cs-caret{transform:rotate(180deg)}
.custom-select-options{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-input);box-shadow:0 12px 30px rgba(var(--shadow-rgb),0.18);padding:6px;z-index:200;max-height:0;overflow:hidden;opacity:0;transform:translateY(-6px) scaleY(0.96);transform-origin:top center;transition:max-height 240ms cubic-bezier(0.34,1.2,0.64,1),opacity 200ms ease,transform 220ms cubic-bezier(0.34,1.2,0.64,1),padding 200ms ease;pointer-events:none}
.custom-select-wrap.open .custom-select-options{max-height:260px;overflow-y:auto;opacity:1;transform:translateY(0) scaleY(1);pointer-events:auto}
.cs-option{padding:10px 12px;border-radius:8px;font:500 13px 'Poppins',sans-serif;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:background 140ms ease,color 140ms ease}
.cs-option:hover{background:color-mix(in srgb, var(--primary) 8%, var(--panel-bg))}
.cs-option.active{color:var(--primary);font-weight:700;background:color-mix(in srgb, var(--primary) 10%, var(--panel-bg))}
.cs-option.disabled{color:var(--text-muted);cursor:not-allowed;opacity:.7}

/* SLOT CARDS (booking step 2) */
.slot-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-input);padding:12px 16px;font-size:13px;color:var(--text)}
.slot-card .slot-meta{display:flex;flex-direction:column;gap:2px}
.slot-card .slot-spots{font-size:12px;color:var(--text-muted)}

/* PROFILE TABS */
.profile-tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.profile-tab{padding:10px 22px;border-radius:999px;border:1.5px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text-muted);font:700 13px 'Poppins',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 200ms ease;opacity:.7}
.profile-tab i{font-size:16px}
.profile-tab:hover{opacity:1;transform:translateY(-1px)}
.profile-tab.active{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.35);opacity:1}
.profile-pane{display:none}
.profile-pane.active{display:block;animation:fadeUp 280ms ease}
.field-hint{font-size:11px;color:var(--error);margin-top:6px;font-weight:600;display:none}
.field-hint.show{display:block}

@media (max-width: 768px){
  .btn-primary,.btn-secondary,.btn-danger,.logout-btn,.profile-tab{font-size:11px;white-space:nowrap;padding-left:12px;padding-right:12px}
  .btn-primary i,.btn-secondary i,.btn-danger i,.logout-btn i,.profile-tab i{font-size:13px}
}

</style>

/* ================= HELPERS ================= */
function escHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function emptyIcon(){ return '<i class="ph ph-minus-circle" style="color:var(--text-muted);opacity:.5;font-size:16px" title="None"></i>'; }
function formatDate(d){ if(!d) return emptyIcon(); const dt=new Date(d); if(isNaN(dt)) return escHtml(d); return dt.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
function formatDateTime(d){ if(!d) return emptyIcon(); const dt=new Date(d); if(isNaN(dt)) return escHtml(d); return dt.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function formatTime(t){
  if(!t) return emptyIcon();
  const parts = String(t).split(':');
  if (parts.length < 2) return escHtml(t);
  let h = parseInt(parts[0],10); const m = parts[1].padStart(2,'0');
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${String(h).padStart(2,'0')}:${m} ${ap}`;
}
function formatCurrency(n){ const v = Number(n||0); return '₦' + v.toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function formatMethod(m){ if(!m) return emptyIcon(); return ({card:'Card',transfer:'Bank Transfer',cash_at_counter:'Cash at Counter'}[m]) || escHtml(m); }
function badge(status){ if(!status) return emptyIcon(); const s = String(status).toLowerCase(); return `<span class="badge ${escHtml(s)}">${escHtml(s)}</span>`; }

function buildTable(columns, rows, opts={}){
  if (!rows || rows.length === 0){
    return `<div class="state-box"><i class="ph ph-tray"></i>${opts.emptyText||'No records found.'}</div>`;
  }
  const thead = '<thead><tr>' + columns.map(c => `<th>${escHtml(c.label)}</th>`).join('') + '</tr></thead>';
  const tbody = '<tbody>' + rows.map(r => '<tr>' + columns.map(c => {
    let v;
    if (c.render) v = c.render(r);
    else if (c.badge) v = badge(r[c.key]);
    else v = escHtml(r[c.key]);
    return `<td${c.cellClass?' class="'+c.cellClass+'"':''}>${v}</td>`;
  }).join('') + '</tr>').join('') + '</tbody>';
  return `<table>${thead}${tbody}</table>`;
}

function buildPagination(pagEl, infoEl, currentPage, pageSize, totalCount, loadFn){
  const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
  const from = totalCount === 0 ? 0 : (currentPage-1)*pageSize + 1;
  const to = Math.min(currentPage*pageSize, totalCount);
  infoEl.textContent = totalCount === 0 ? 'No results' : `Showing ${from}–${to} of ${totalCount} results`;

  let html = `<button class="page-pill" ${currentPage===1?'disabled':''} data-p="${currentPage-1}"><i class="ph ph-caret-left"></i></button>`;
  const pages = [];
  const maxShow = 5;
  let start = Math.max(1, currentPage - 2);
  let end = Math.min(totalPages, start + maxShow - 1);
  start = Math.max(1, end - maxShow + 1);
  for (let i = start; i <= end; i++) pages.push(i);
  pages.forEach(p => {
    html += `<button class="page-pill ${p===currentPage?'active':''}" data-p="${p}">${p}</button>`;
  });
  html += `<button class="page-pill" ${currentPage===totalPages?'disabled':''} data-p="${currentPage+1}"><i class="ph ph-caret-right"></i></button>`;
  pagEl.innerHTML = html;
  pagEl.querySelectorAll('.page-pill[data-p]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = parseInt(btn.dataset.p,10);
      if (!isNaN(p) && p >= 1 && p <= totalPages) loadFn(p);
    });
  });
}

/* ================= TOAST ================= */
function showToast(type, title, message){
  const wrap = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast t-${type}`;
  const icons = { success:'ph-fill ph-check-circle', error:'ph-fill ph-x-circle', info:'ph-fill ph-info' };
  const icon = icons[type] || icons.info;
  t.innerHTML =
    `<div class="toast-drag-hint"></div>` +
    `<div class="toast-icon"><i class="${icon}" aria-hidden="true"></i></div>` +
    `<div class="toast-body"><div class="toast-title">${escHtml(title)}</div><div class="toast-msg">${escHtml(message)}</div></div>` +
    `<button class="toast-close" type="button" aria-label="Dismiss"><i class="ph ph-x" aria-hidden="true"></i></button>`;

  let autoTimer = null;
  const remove = () => { clearTimeout(autoTimer); t.remove(); };
  t.querySelector('.toast-close').addEventListener('click', remove);
  wrap.appendChild(t);
  autoTimer = setTimeout(remove, 4000);

  /* ---------- Drag to dismiss (mouse + touch) ---------- */
  const DISMISS_THRESHOLD = 80; // px in any direction
  let startX = 0, startY = 0;
  let curX = 0, curY = 0;
  let dragging = false;

  function onDragStart(x, y){
    startX = x; startY = y; curX = 0; curY = 0;
    dragging = true;
    clearTimeout(autoTimer);
    t.classList.add('is-dragging');
    t.style.transition = 'none';
  }

  function onDragMove(x, y){
    if (!dragging) return;
    curX = x - startX;
    curY = y - startY;
    const dist = Math.hypot(curX, curY);
    const opacity = Math.max(0, 1 - dist / (DISMISS_THRESHOLD * 1.5));
    t.style.transform = `translate(${curX}px, ${curY}px)`;
    t.style.opacity = opacity;
  }

  function onDragEnd(){
    if (!dragging) return;
    dragging = false;
    const dist = Math.hypot(curX, curY);
    if (dist >= DISMISS_THRESHOLD){
      /* Fling out in the drag direction */
      const scale = 2.5;
      t.style.transition = 'transform 250ms ease, opacity 200ms ease';
      t.style.transform = `translate(${curX * scale}px, ${curY * scale}px)`;
      t.style.opacity = '0';
      setTimeout(remove, 260);
    } else {
      /* Snap back */
      t.style.transition = 'transform 320ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease';
      t.style.transform = 'translate(0,0)';
      t.style.opacity = '1';
      t.classList.remove('is-dragging');
      autoTimer = setTimeout(remove, 3000);
    }
  }

  /* Mouse events */
  t.addEventListener('mousedown', e => {
    if (e.target.closest('.toast-close')) return;
    onDragStart(e.clientX, e.clientY);
    const onMove = ev => onDragMove(ev.clientX, ev.clientY);
    const onUp   = ()  => { onDragEnd(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
  });

  /* Touch events */
  t.addEventListener('touchstart', e => {
    if (e.target.closest('.toast-close')) return;
    const touch = e.touches[0];
    onDragStart(touch.clientX, touch.clientY);
  }, { passive: true });
  t.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    onDragMove(touch.clientX, touch.clientY);
    e.preventDefault();
  }, { passive: false });
  t.addEventListener('touchend', () => onDragEnd());
  t.addEventListener('touchcancel', () => onDragEnd());
}

/* ================= CONFIRM ================= */
function showConfirm(title, message){
  return new Promise(resolve => {
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop';
    bd.innerHTML = `<div class="modal-card" role="dialog"><div class="modal-title">${escHtml(title)}</div><div class="modal-msg">${escHtml(message)}</div><div class="modal-actions"><button class="btn-secondary" data-act="cancel">Cancel</button><button class="btn-danger" data-act="ok" style="padding:10px 20px;font-size:13px">Confirm</button></div></div>`;
    document.body.appendChild(bd);
    const close = (v) => { bd.remove(); resolve(v); };
    bd.addEventListener('click', e => { if (e.target === bd) close(false); });
    bd.querySelector('[data-act="cancel"]').addEventListener('click', () => close(false));
    bd.querySelector('[data-act="ok"]').addEventListener('click', () => close(true));
  });
}

/* ================= AUTH (real Supabase) ================= */
let currentUser = null;
let selectedSlot = null;

async function checkAuth(){
  const { data: { session } } = await supabase.auth.getSession();

  if (!session){
    window.location.href = 'index.html';
    return;
  }

  currentUser = session.user;

  const { data: roleRow, error: roleErr } = await supabase
    .from('user_roles')
    .select('role')
    .eq('id', currentUser.id)
    .single();

  if (roleErr || !roleRow || roleRow.role !== 'patient'){
    window.location.href = 'index.html';
    return;
  }

  const { data: patient } = await supabase
    .from('patients')
    .select('full_name, is_active')
    .eq('id', currentUser.id)
    .single();

  if (patient && patient.is_active === false){
    document.body.innerHTML = '<h1>Account Deactivated</h1><p>Your account has been deactivated. Please contact the hospital admin for assistance.</p>';
    await supabase.auth.signOut();
    return;
  }

  window.currentProfile = { name: patient ? patient.full_name : '' };
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initDashboard();
}

async function doLogout(){
  const ok = await showConfirm('Sign Out', 'Are you sure you want to sign out of your account?');
  if (!ok) return;
  await supabase.auth.signOut();
  window.location.href = 'index.html';
}

/* ================= TAB SWITCH ================= */
function switchTab(tabName){
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tabName));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-'+tabName);
  if (target) target.classList.add('active');
  closeDrawer();
  switch(tabName){
    case 'dashboard': initDashboard(); break;
    case 'appointments': initAppointments(); break;
    case 'prescriptions': initPrescriptions(); break;
    case 'payments': initPayments(); break;
  }
}

/* ================= CUSTOM SELECT ================= */
const CS_STATE = {};
function _csClose(id){
  const wrap = document.getElementById(id);
  if (!wrap) return;
  wrap.classList.remove('open');
}
function _csCloseAll(except){
  document.querySelectorAll('.custom-select-wrap.open').forEach(w => { if (w.id !== except) w.classList.remove('open'); });
}
document.addEventListener('click', e => {
  if (!e.target.closest('.custom-select-wrap')) _csCloseAll();
});
function _csRender(id){
  const wrap = document.getElementById(id);
  const st = CS_STATE[id];
  if (!wrap || !st) return;
  const sel = st.options.find(o => String(o.value) === String(st.value));
  const labelText = sel ? sel.label : (st.placeholder || 'Select…');
  const cls = sel ? '' : ' placeholder';
  const opts = st.options.length
    ? st.options.map(o => `<div class="cs-option${String(o.value)===String(st.value)?' active':''}${o.disabled?' disabled':''}" data-v="${escHtml(o.value)}">${escHtml(o.label)}${String(o.value)===String(st.value)?'<i class="ph ph-check"></i>':''}</div>`).join('')
    : '<div class="cs-option disabled">No options</div>';
  wrap.innerHTML = `<button type="button" class="custom-select-trigger"><span class="cs-label${cls}">${escHtml(labelText)}</span><i class="ph ph-caret-down cs-caret"></i></button><div class="custom-select-options">${opts}</div>`;
  wrap.querySelector('.custom-select-trigger').addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = wrap.classList.contains('open');
    _csCloseAll(id);
    wrap.classList.toggle('open', !isOpen);
  });
  wrap.querySelectorAll('.cs-option').forEach(opt => {
    if (opt.classList.contains('disabled')) return;
    opt.addEventListener('click', e => {
      e.stopPropagation();
      const v = opt.dataset.v;
      setCustomSelectValue(id, v);
      wrap.classList.remove('open');
      if (st.onChange) st.onChange(v);
    });
  });
}
function initCustomSelect(id, options, opts={}){
  const wrap = document.getElementById(id);
  if (!wrap) return;
  CS_STATE[id] = {
    options: options || [],
    value: opts.value !== undefined ? opts.value : (wrap.dataset.csDefault || ''),
    placeholder: opts.placeholder || wrap.dataset.csPlaceholder || 'Select…',
    onChange: opts.onChange || null,
  };
  _csRender(id);
}
function populateCustomSelect(id, options){
  if (!CS_STATE[id]) initCustomSelect(id, options);
  else {
    CS_STATE[id].options = options || [];
    if (!options.find(o => String(o.value) === String(CS_STATE[id].value))) CS_STATE[id].value = '';
    _csRender(id);
  }
}
function getCustomSelectValue(id){ return CS_STATE[id]?.value || ''; }
function setCustomSelectValue(id, v){
  if (!CS_STATE[id]) return;
  CS_STATE[id].value = v == null ? '' : String(v);
  _csRender(id);
}
function setCustomSelectOnChange(id, fn){
  if (!CS_STATE[id]) return;
  CS_STATE[id].onChange = fn;
}


/* ══════════════════════════════════════
   Dynamically measure the fixed
   topbar + desktop nav strip (or mobile topbar) so
   .main never gets tucked underneath them, regardless
   of how many rows the nav wraps into.
══════════════════════════════════════ */
function updateMainTopOffset() {
  const topbarShell = document.querySelector('.topbar-shell');
  const navWrapper   = document.getElementById('desktopNavWrapper');
  let offset = 0;

  if (topbarShell) {
    const r = topbarShell.getBoundingClientRect();
    offset = Math.max(offset, r.bottom);
  }
  if (navWrapper && getComputedStyle(navWrapper).display !== 'none') {
    const r = navWrapper.getBoundingClientRect();
    offset = Math.max(offset, r.bottom);
  }

  const gap = 16;
  document.documentElement.style.setProperty('--main-top-offset', `${Math.ceil(offset + gap)}px`);
}

window.addEventListener('load', updateMainTopOffset);
window.addEventListener('resize', updateMainTopOffset);

/* ================= EVENTS ================= */
document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  applyThemeIcon();
  updateMainTopOffset();
  setTimeout(updateMainTopOffset, 300);

  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('topbarLogoutBtn').addEventListener('click', doLogout);
  document.getElementById('drawerLogoutBtn').addEventListener('click', doLogout);
  document.getElementById('hamburgerBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

  // Refresh dashboard button
  document.getElementById('dashRefreshBtn').addEventListener('click', () => {
    const icon = document.getElementById('dashRefreshIcon');
    icon.style.transition = 'transform 0.6s ease';
    icon.style.transform = 'rotate(360deg)';
    setTimeout(() => { icon.style.transition = 'none'; icon.style.transform = 'rotate(0deg)'; }, 650);
    initDashboard();
    showToast('success', 'Refreshed', 'Dashboard updated with latest data.');
  });

  // ===== Custom selects init =====
  initCustomSelect('apptDoctor', []);

  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.jump)));

  // Appointments — open/close booking panel
  const toggleApptForm = document.getElementById('toggleApptForm');
  const apptFormWrap = document.getElementById('apptFormWrap');
  toggleApptForm.addEventListener('click', () => {
    apptFormWrap.classList.toggle('open');
  });
  document.getElementById('apptCancelBtn').addEventListener('click', () => {
    apptFormWrap.classList.remove('open');
    document.getElementById('bookStep2').style.display = 'none';
    document.getElementById('bookStep3').style.display = 'none';
    selectedSlot = null;
  });
  document.getElementById('apptCancelBtn2').addEventListener('click', () => {
    apptFormWrap.classList.remove('open');
    document.getElementById('bookStep2').style.display = 'none';
    document.getElementById('bookStep3').style.display = 'none';
    selectedSlot = null;
  });

  checkAuth();
});
</script>
</body>
</html>
